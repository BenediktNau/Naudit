# VEX-Ausnahmen fuer das Release-Image-Gate (release.yml, `trivy image`).
# YAML-Format, damit jede Ausnahme PFAD-GESCOPET ist (paths): ein flaches .trivyignore
# wuerde global wirken und dieselbe CVE auch in anderen Binaries/Dependencies unbemerkt
# durchlassen. Jeder Eintrag traegt Begruendung UND `expired_at`: ohne Ablauf wird aus einer
# bewussten Ausnahme eine stille Dauer-Duldung.
#
# AKTUELL KEINE AUSNAHMEN -- und das ist Absicht, nicht Vergessen.
#
# Bis Trivy 0.72.0 standen hier vier Eintraege, alle pfad-gescopet auf das mitgelieferte
# `trivy`-Binary, alle mit derselben Begruendung: "nicht patchbar, v0.72.0 ist das neueste
# Trivy-Release". Mit dem Bump auf 0.76.1 (Dockerfile, TRIVY_VERSION) ist diese Begruendung
# entfallen -- jede der vier CVEs ist im neuen Binary echt gefixt. Nachgemessen an der im
# Binary eingebetteten Modulliste (`go version -m /usr/local/bin/trivy`), also an genau der
# Quelle, aus der auch Trivy seine eigenen Funde ableitet:
#
#   CVE-2026-50151        oras-go  >= 2.6.1 noetig  -- 0.76.1 buendelt v2.6.2   -> entfernt
#   GHSA-hrxh-6v49-42gf   grpc-go  >= 1.82.1 noetig -- 0.76.1 buendelt v1.84.0  -> entfernt
#   CVE-2026-56852        x/text   >= 0.39.0 noetig -- 0.76.1 buendelt v0.42.0  -> entfernt
#   CVE-2026-39822        Go       >= 1.26.5 noetig -- 0.76.1 ist mit go1.27.3 gebaut -> entfernt
#
# Die Eintraege wurden deshalb geloescht statt verlaengert: eine Ausnahme, deren Grund weg ist,
# gehoert raus -- genau so, wie es in jedem der vier Eintraege als Bedingung stand ("ENTFERNEN,
# sobald ein Trivy-Release ... buendelt").
#
# Fuer kuenftige Ausnahmen gilt unveraendert: pfad-gescopet (`paths`), mit `statement` und
# `expired_at`. Was wir selbst bauen (betterleaks), wird echt gefixt -- der Quell-Build im
# Dockerfile hebt dessen verwundbare Dependencies an und sichert das per fail-closed Guard ab;
# solche Faelle gehoeren nicht in diese Datei.
vulnerabilities: []
