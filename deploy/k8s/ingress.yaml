# TLS terminiert am Ingress; Naudit honoriert X-Forwarded-Proto von selbst.
# ACHTUNG: die Proxy-Allow-List ist per Default LEER, Naudit vertraut den
# Forwarded-Headern also jeder Quelle. Fuer den Produktivbetrieb das Pod-Netz
# des Ingress-Controllers in Naudit__ForwardedHeaders__KnownNetworks__0
# eintragen (Block liegt auskommentiert in deployment.yaml) — sonst kann jeder,
# der den Ingress umgeht, Schema und Client-IP faelschen. Siehe
# docs/deployment.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naudit
  namespace: naudit
  labels:
    app.kubernetes.io/name: naudit
  # annotations:
  #   cert-manager.io/cluster-issuer: <euer-issuer>
spec:
  ingressClassName: nginx # an den Cluster anpassen (z. B. traefik)
  rules:
    - host: naudit.example.internal # anpassen!
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naudit
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - naudit.example.internal
  #     secretName: naudit-tls
